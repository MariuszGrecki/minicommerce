services: 
  postgres:
    image: postgres:17
    container_name: minicommerce_postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:53456:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: minicommerce_adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "18082:8080"
    depends_on:
      - postgres

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp   
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    volumes:
      - ./services/order-service:/app
    command:
      - php
      - artisan
      - serve
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "127.0.0.1:33377:8000"
    depends_on:
      - postgres

  queue-worker:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      XDEBUG_MODE: "off"   
    working_dir: /app
    volumes:
      - ./services/order-service:/app
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=61
    restart:
      unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data: