services: 
  postgres:
    image: postgres:17
    container_name: minicommerce_postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:53456:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp   
    working_dir: /app
    volumes:
      - ./services/order-service:/app
    command:
      - php
      - artisan
      - serve
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "127.0.0.1:33377:8000"
    depends_on:
      - postgres

volumes:
  postgres_data: